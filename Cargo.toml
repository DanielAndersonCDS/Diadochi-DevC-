[package]
name = "diadochi-devcpp"
version = "0.1.0"
edition = "2021"
description = "Diadochi Dev C++ - a modern shell over the Dev-C++ compiler with Rust-style safety rules for C/C++"

[dependencies]
eframe = { version = "=0.29.1", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
